<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anexos del Ministerio de Gobernación</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #243b55); color: white;
    }
    main {
      width: min(100%, 520px); padding: 38px 28px; text-align: center;
      background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18);
      border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.28);
    }
    .icon { font-size: 54px; margin-bottom: 14px; }
    h1 { font-size: clamp(23px, 5vw, 30px); margin: 0 0 12px; }
    p { color: #d9e3ef; line-height: 1.6; margin: 0 0 25px; }
    a {
      display: inline-block; padding: 14px 24px; border-radius: 10px;
      background: #e8b84b; color: #182334; font-weight: 700;
      text-decoration: none; transition: transform .2s, background .2s;
    }
    a:hover { background: #ffd36d; transform: translateY(-2px); }
    small { display: block; margin-top: 20px; color: #c1ccda; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📄</div>
    <h1>Anexos del Ministerio de Gobernación</h1>
    <p>Presiona el siguiente enlace para abrir el documento PDF.</p>
    <a href="ANEXOS_DEL_MINISTERIO_DE_GOBERNACION.pdf" target="_blank" rel="noopener">
      Abrir documento PDF
    </a>
    <small>El documento se abrirá en una nueva pestaña.</small>
  </main>
</body>
</html>
